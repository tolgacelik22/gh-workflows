name: build-image

on:
  workflow_call:
    inputs:
      app:
        description: "Uygulama adı (manifests/<app> ile aynı)"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile yolu (context'e göre)"
        required: false
        type: string
        default: "Dockerfile"
    secrets:
      INFRA_DEPLOY_KEY:
        description: "infra repo'suna yazabilen SSH deploy key (private key)"
        required: true

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: infra repo'da imaj tag'ini güncelle
        env:
          DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s' "$DEPLOY_KEY" > ~/.ssh/infra_key && chmod 600 ~/.ssh/infra_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/infra_key"
          git clone --depth 1 "git@github.com:${{ github.repository_owner }}/infra.git" infra
          cd "infra/manifests/${{ inputs.app }}"
          curl -sLo /tmp/kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz"
          tar xzf /tmp/kustomize.tgz -C /tmp
          /tmp/kustomize edit set image "ghcr.io/${{ github.repository_owner }}/${{ inputs.app }}=ghcr.io/${{ github.repository_owner }}/${{ inputs.app }}:${{ github.sha }}"
          cd ../..
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add "manifests/${{ inputs.app }}/kustomization.yaml"
          git commit -m "deploy(${{ inputs.app }}): ${{ github.sha }}" || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase && sleep $((RANDOM % 5 + 2))
          done
          git push
